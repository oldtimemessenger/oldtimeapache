kind = "mobile"
previewPath = "/oldtime-mobile/"
title = "Oldtime Mobile"
description = "An Expo iOS and Android wrapper for the existing Oldtime Cloudflare-hosted app. Preserves the live interface and accounts without migrating the website or backend."
version = "1.0.0"
id = "artifacts/oldtime-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/oldtime-mobile/" ]
localPort = 18174

[services.development]
run = "pnpm --filter @workspace/oldtime-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oldtime-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/oldtime-mobile", "run", "serve" ]

[services.env]
PORT = "18174"
BASE_PATH = "/oldtime-mobile/"
