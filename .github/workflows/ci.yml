name: Oldtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oldtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for browser regression tests
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Test frontend
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm --filter @workspace/oldtimehive run test

      - name: Test API
        run: pnpm --filter @workspace/api-server run test

      - name: Test Cloudflare Pages integration
        run: pnpm run test:cloudflare

      - name: Build Cloudflare Pages frontend
        run: pnpm run cloudflare:build

      - name: Dry-run API Worker build
        run: pnpm --filter @workspace/api-server run build
