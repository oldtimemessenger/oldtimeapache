        createdAt: { type: number }
        author:
          type: object
          required: [id, username, displayName]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string }
            isVirtual: { type: boolean }
    CloudCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
    BadgePromotions:
      type: object
      additionalProperties: false
      required: [introductoryEnabled, returningEnabled, returningInactiveDays, returningOfferDays]
      properties:
        introductoryEnabled: { type: boolean }
        returningEnabled: { type: boolean }
        returningInactiveDays: { type: integer, minimum: 1, maximum: 365 }
        returningOfferDays: { type: integer, minimum: 1, maximum: 90 }
    CreatorProgramConfig:
      type: object
      additionalProperties: false
      required: [flags, thresholds, campaigns, pricing, promotions, distribution]
      properties:
        promotions: { $ref: "#/components/schemas/BadgePromotions" }
        distribution: { $ref: "#/components/schemas/BadgeDistribution" }
        flags:
          type: object
          additionalProperties: false
          required: [creatorCenter, automaticApproval, blueBadge, announcements, promotions, milestones]
          properties:
            creatorCenter: { type: boolean }
            automaticApproval: { type: boolean }
            blueBadge: { type: boolean }
            announcements: { type: boolean }
            promotions: { type: boolean }
            milestones: { type: boolean }
        thresholds:
          type: object
          additionalProperties: false
          required: [accountAgeDays, originalPosts, activeDays, engagementReceived, communityInteractions]
          properties:
            accountAgeDays: { type: integer, minimum: 1, maximum: 365 }
            originalPosts: { type: integer, minimum: 1, maximum: 10000 }
            activeDays: { type: integer, minimum: 1, maximum: 14 }
            engagementReceived: { type: integer, minimum: 1, maximum: 100000 }
            communityInteractions: { type: integer, minimum: 1, maximum: 10000 }
        campaigns: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/AnnouncementCampaign" } }
        pricing:
          type: object
          additionalProperties: false
          required: [standardPriceCents, trialMonths, returningPriceCents, currency]
          properties:
            standardPriceCents: { type: integer, minimum: 1, maximum: 100000 }
            trialMonths: { type: integer, minimum: 0, maximum: 12 }
            returningPriceCents: { type: integer, minimum: 1, maximum: 100000 }
            currency: { type: string, enum: [USD] }
    BlastStateResponse:
      type: object
      additionalProperties: false
      required: [revision, data]
      properties:
        revision: { type: integer, minimum: 0 }
        data: { oneOf: [{ type: object, additionalProperties: true }, { type: "null" }] }
    BlastStateInput:
      type: object
      additionalProperties: false
      required: [revision, data]
      properties:
        revision: { type: integer, minimum: 0 }
        data: { type: object, additionalProperties: true }
    BlastStateSaved:
      type: object
      additionalProperties: false
      required: [revision, data]
      properties:
        revision: { type: integer, minimum: 1 }
        data: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

