        "400": { description: Invalid draft or unconfirmed media }
    delete:
      operationId: deleteCreativeDraft
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Owner’s draft removed }
  /media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPrivateMedia
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner-only private media
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { description: Media does not exist or is not owned by the viewer }
    delete:
      operationId: deletePrivateMedia
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Owner-only media removed from private storage }
        "404": { description: Media does not exist or is not owned by the viewer }
  /media/{id}/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reservePrivateMediaUpload
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivateMediaUploadInput" } } }
      responses:
        "200":
          description: Existing upload reservation or already confirmed media
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadReservation" } } }
        "201":
          description: Resumable upload reservation created
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadReservation" } } }
        "400": { description: Unsupported media metadata }
        "409": { description: Media ID conflicts with an existing upload }
        "503": { description: Cloud storage could not create the signed upload session }
  /media/{id}/thumbnail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: linkVideoMediaThumbnail
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VideoThumbnailLinkInput" } } }
      responses:
        "200": { description: Verified thumbnail linked to its video }
        "400": { description: The video or thumbnail is invalid }
        "404": { description: Video or thumbnail not found }
        "409": { description: The thumbnail cannot be linked to this video }
  /media/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmPrivateMediaUpload
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivateMediaUploadConfirm" } } }
      responses:
        "200": { description: Cloud storage verified the upload }
        "404": { description: Upload reservation not found }
        "409": { description: The uploaded object does not match the reservation }
        "503": { description: Cloud storage has not confirmed the upload yet }
  /media/{id}/url:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPrivateMediaUrl
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Short-lived signed URL for authorized media
          content: { application/json: { schema: { $ref: "#/components/schemas/PrivateMediaUrl" } } }
        "404": { description: Media does not exist or is not visible to the viewer }
  /blast/state/{scope}:
    parameters:
      - { name: scope, in: path, required: true, schema: { type: string, enum: [social, video-notes] } }
    get:
      operationId: getBlastAccountState
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner-only cloud state for Blast
          content: { application/json: { schema: { $ref: "#/components/schemas/BlastStateResponse" } } }
        "400": { description: Invalid state scope }
    put:
      operationId: putBlastAccountState
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BlastStateInput" } } }
      responses:
        "200":
          description: Blast state saved with the next revision
          content: { application/json: { schema: { $ref: "#/components/schemas/BlastStateSaved" } } }
        "400": { description: Invalid state or attachment }
        "409": { description: State changed in another session }
        "413": { description: State exceeds the storage limit }
    delete:
      operationId: deletePrivateMedia
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Owner-only media removed from private storage }
        "404": { description: Media does not exist or is not owned by the viewer }
  /stories/{id}/questions:
    get:
      operationId: listPrivateStoryQuestions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 2000 } }
        - { name: questionId, in: query, schema: { type: string, format: uuid }, description: Open one private question from an owner notification }
      responses:
        "200":
          description: Owner-only private question inbox
          content: { application/json: { schema: { $ref: "#/components/schemas/PrivateStoryQuestionsResponse" } } }
        "404": { description: Not the owner or Status not found }
  /stories/{id}/stickers/{stickerId}/questions:
    post:
      operationId: submitStoryStickerQuestion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stickerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryQuestionInput" } } }
      responses:
        "201":
          description: Private question accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/StoryQuestionReceipt" } } }
        "404": { description: Status or sticker not visible }
        "429": { description: Question limit reached }
  /stories/{id}/stickers/{stickerId}/participants:
    get:
      operationId: listStoryStickerParticipants
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stickerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 2000 } }
      responses:
        "200":
          description: Visible active Status entries in the same trend
          content: { application/json: { schema: { $ref: "#/components/schemas/StoryParticipantsResponse" } } }
        "404": { description: Status or sticker not visible }
  /stories/capabilities:
    get:
      operationId: getStatusCapabilities
      tags: [Stories]
      summary: Check interactive Status support before uploading a composition
      responses:
        "200":
          description: Capabilities of the running Status service
          content:
            application/json:
              schema:
                type: object
                required: [stickers, privateQuestions, mentions]
                properties:
                  stickers:
                    type: boolean
                  privateQuestions:
                    type: boolean
                  mentions:
                    type: boolean
  /stories:
    get:
      operationId: listStories
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Active stories visible to the signed-in account, content: { application/json: { schema: { $ref: "#/components/schemas/StoriesResponse" } } } }
    post:
      operationId: createStory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateStoryInput" } } }
      responses:
        "201": { description: Story metadata saved, content: { application/json: { schema: { $ref: "#/components/schemas/StoryResponse" } } } }
        "400": { description: Invalid story }
  /stories/import:
    post:
      operationId: importLegacyStory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryImportInput" } } }
      responses:
        "200": { description: Legacy Story stored or matched idempotently, content: { application/json: { schema: { $ref: "#/components/schemas/StoryImportResponse" } } } }
        "400": { description: Invalid legacy Story }
        "409": { description: Existing Story conflicts with the submitted source record }
  /stories/{id}/media:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadStoryMedia
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Private story media uploaded }
        "400": { description: Invalid media or story }
        "415": { description: Video Stories must use the optimized media upload flow }
    get:
      operationId: readStoryMedia
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Private media for an active story visible to the signed-in account, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { description: Story not found or not visible }
  /stories/{id}/media-url:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStoryMediaUrl
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Short-lived signed link and optional poster for media on a visible Story
          content: { application/json: { schema: { $ref: "#/components/schemas/StoryMediaUrl" } } }
        "404": { description: Story not found or not visible }
        "503": { description: Story media could not be loaded }
  /stories/{id}/views:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordStoryView
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: View recorded once for this account, content: { application/json: { schema: { $ref: "#/components/schemas/StoryViewResponse" } } } }
        "404": { description: Story not found or not visible }
  /stories/{id}/reactions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: upsertStoryReaction
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryReactionInput" } } }
      responses:
        "200": { description: Reaction saved, content: { application/json: { schema: { $ref: "#/components/schemas/StoryReactionResponse" } } } }
        "409": { description: The signed-in account cannot react to its own Story }
        "404": { description: Story not found or not visible }
    delete:
      operationId: deleteStoryReaction
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Current user's reaction removed }
        "404": { description: Story not found or not visible }
  /stories/{id}/activity:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStoryActivity
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Story views and reactions visible only to the Story owner, content: { application/json: { schema: { $ref: "#/components/schemas/StoryActivityResponse" } } } }
        "404": { description: Story not owned by the signed-in account }
  /stories/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listStoryComments
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Replies for a Story visible to the signed-in account, content: { application/json: { schema: { $ref: "#/components/schemas/StoryCommentsResponse" } } } }
        "404": { description: Story not found or not visible }
    post:
      operationId: createStoryComment
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryCommentInput" } } }
      responses:
        "201": { description: Reply sent, content: { application/json: { schema: { $ref: "#/components/schemas/StoryCommentResponse" } } } }
        "400": { description: Invalid reply or replies disabled }
        "409": { description: Reply is disabled or the Story has expired }
        "404": { description: Story not found or not visible }
  /stories/{id}/comments/{commentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteStoryComment
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Reply deleted by its author or Story owner }
        "404": { description: Reply not found or not authorized }
  /stories/{id}:
    get:
      operationId: getVisibleStoryById
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Visible active or profile-saved Status with sticker metadata
          content: { application/json: { schema: { $ref: "#/components/schemas/StoryResponse" } } }
        "404": { description: Status unavailable }
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateStory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStoryInput" } } }
      responses:
        "200": { description: Story settings updated, content: { application/json: { schema: { $ref: "#/components/schemas/StoryResponse" } } } }
        "404": { description: Story not owned by the signed-in account }
    delete:
      operationId: deleteStory
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Story and its private media deleted }
        "404": { description: Story not owned by the signed-in account }
  /moderation/access:
    # Reviewer access is checked by the server, never by a profile flag.
    get:
      operationId: getModerationAccess
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Whether this account can review reports
          content:
            application/json:
              schema: { type: object, required: [allowed], properties: { allowed: { type: boolean } } }
  /moderation/reports:
    get:
      operationId: getModerationReports
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, reviewed, dismissed, all] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        "200":
          description: Permission-protected review queue
          content:
            application/json:
              schema:
                type: object
                required: [reports, hasMore, nextOffset]
                properties:
                  reports: { type: array, items: { type: object, additionalProperties: true } }
                  hasMore: { type: boolean }
                  nextOffset: { type: integer }
    put:
      operationId: updateModerationDecision
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, status]
              properties:
                key: { type: string, maxLength: 120 }
                status: { type: string, enum: [open, reviewed, dismissed] }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: Review decision recorded without changing the reported content }
  /public/share:
    get:
      operationId: getPublicSharePreview
      security: []
      parameters:
        - { name: post, in: query, schema: { type: string } }
        - { name: place, in: query, schema: { type: string } }
        - { name: label, in: query, schema: { type: string, maxLength: 140 } }
      responses:
        "200":
          description: Public post or place preview, never private content
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  description: { type: string }
                  imagePath: { type: string }
                  postId: { type: string }
                  placeId: { type: string }
  /public/share-image:
    get:
      operationId: getPublicShareImage
      security: []
      parameters:
        - { name: post, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public post image or video thumbnail, with a current visibility check
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /places/landing:
    get:
      operationId: getPlacesLanding
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Public place covers ranked by ratings, saves, connections, interests and this week's posts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  places: { type: array, items: { type: object, additionalProperties: true } }
                  landing:
                    type: object
                    properties:
                      loved: { type: array, items: { type: object, additionalProperties: true } }
                      nearby: { type: array, items: { type: object, additionalProperties: true } }
                      suggested: { type: array, items: { type: object, additionalProperties: true } }
                      trending: { type: array, items: { type: object, additionalProperties: true } }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    LibrarySavedPage:
      type: object
      required: [posts, hasMore, nextOffset]
      properties:
        posts: { type: array, items: { $ref: "#/components/schemas/SocialPost" } }
        hasMore: { type: boolean }
        nextOffset: { type: integer }
    ArchivedStoryPage:
      type: object
      required: [stories, hasMore, nextOffset]
      properties:
        stories: { type: array, items: { $ref: "#/components/schemas/Story" } }
        hasMore: { type: boolean }
        nextOffset: { type: integer }
    SafetyReportInput:
      type: object
      required: [kind, category, reason]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [problem, profile, post, story, comment, message]}
        category: {type: string, minLength: 1, maxLength: 80}
        reason: {type: string, minLength: 10, maxLength: 1000}
        targetUserId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        postId: {type: string, minLength: 1, maxLength: 128}
        commentId: {type: string, minLength: 1, maxLength: 128}
    CommunityFeedRule:
      type: object
      additionalProperties: false
      properties:
        hideReplies: {type: boolean, default: false}
        hideReposts: {type: boolean, default: false}
        hideQuotes: {type: boolean, default: false}
        onlyFollowing: {type: boolean, default: false}
        language: {type: string, default: all}
        includeUnlabelled: {type: boolean, default: true}
    CommunityPreferencesInput:
      type: object
      required: [pinned, filters, mutedWords, mutedAccounts]
      additionalProperties: false
      properties:
        pinned: {type: array, minItems: 1, maxItems: 30, items: {type: string}}
        filters:
          type: object
          additionalProperties: {$ref: "#/components/schemas/CommunityFeedRule"}
        mutedWords: {type: array, maxItems: 100, items: {type: string, maxLength: 80}}
        mutedAccounts: {type: array, maxItems: 200, items: {type: string, format: uuid}}
    CommunityPreferencesEnvelope:
      type: object
      required: [preferences]
      properties:
        preferences:
          allOf:
            - {$ref: "#/components/schemas/CommunityPreferencesInput"}
            - type: object
              properties:
                caughtUp: {type: object, additionalProperties: {type: integer}}
        mutedAccounts:
          type: array
          items: {$ref: "#/components/schemas/CommunityListMember"}
    CommunityCatchUpInput:
      type: object
      required: [feed]
      properties:
        feed: {type: string}
    CommunityLanguageInput:
      type: object
      required: [language]
      properties:
        language: {type: string}
    CommunityListMember:
      type: object
      required: [id, username, displayName]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
    CommunityListInput:
      type: object
      required: [name, description, isPublic, members]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        description: {type: string, maxLength: 400}
        isPublic: {type: boolean}
        members: {type: array, maxItems: 200, items: {type: string, format: uuid}}
    CommunityCuratedList:
      type: object
      required: [id, ownerId, name, description, isPublic, owned, followed, members]
      properties:
        id: {type: string}
        ownerId: {type: string}
        name: {type: string}
        description: {type: string}
        isPublic: {type: boolean}
        owned: {type: boolean}
        followed: {type: boolean}
        members:
          type: array
          items: {$ref: "#/components/schemas/CommunityListMember"}
    CommunityListsPage:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items: {$ref: "#/components/schemas/CommunityCuratedList"}
    CommunityListEnvelope:
      type: object
      required: [list]
      properties:
        list: {$ref: "#/components/schemas/CommunityCuratedList"}
    CommunityFeedPage:
      type: object
      required: [posts, hasMore, nextOffset, feed]
      properties:
        posts:
          type: array
          items: {$ref: "#/components/schemas/SocialPost"}
        hasMore: {type: boolean}
        nextOffset: {type: integer}
        feed: {type: string}
        reason: {type: [string, "null"]}
        reasons: {type: object, additionalProperties: {type: string}}
        caughtUpAt: {type: [integer, "null"]}
        filter: {$ref: "#/components/schemas/CommunityFeedRule"}
        languageNote: {type: string}
    ClientPerformanceEventInput:
      type: object
      additionalProperties: false
      required: [event, metrics, outcome]
      properties:
        event: { type: string, enum: [feed, video] }
        outcome: { type: string, enum: [success, failure, frame, play-rejected, media-error, timeout, url-error] }
        frameSignal: { type: string, enum: [video-frame, loadeddata, none] }
        metrics:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            fetchMs: { type: number, minimum: 0, maximum: 120000 }
            renderMs: { type: number, minimum: 0, maximum: 120000 }
            totalMs: { type: number, minimum: 0, maximum: 120000 }
            workerMs: { type: number, minimum: 0, maximum: 120000 }
            rowsMs: { type: number, minimum: 0, maximum: 120000 }
            hydrateMs: { type: number, minimum: 0, maximum: 120000 }
            rankMs: { type: number, minimum: 0, maximum: 120000 }
            urlMs: { type: number, minimum: 0, maximum: 120000 }
            activeToFrameMs: { type: number, minimum: 0, maximum: 120000 }
            playCallMs: { type: number, minimum: 0, maximum: 120000 }
    EngineRecord:
      type: object
      additionalProperties: true
    EngineOperationsSnapshot:
      type: object
      required: [config, events, drafts, actions, activity, provider, accounts, publications, runtimeState, workerSchedule]
      properties:
        config: { $ref: "#/components/schemas/EngineRuntimeInput" }
        events: { type: array, items: { $ref: "#/components/schemas/EngineRecord" } }
        drafts: { type: array, items: { $ref: "#/components/schemas/EngineRecord" } }
        actions: { type: array, items: { $ref: "#/components/schemas/EngineRecord" } }
        activity: { type: array, items: { $ref: "#/components/schemas/EngineRecord" } }
        accounts: { type: array, items: { $ref: "#/components/schemas/EngineAccountActivity" } }
        publications: { type: array, items: { $ref: "#/components/schemas/EngineRecord" } }
        runtimeState: { $ref: "#/components/schemas/EngineRuntimeState" }
        workerSchedule: { $ref: "#/components/schemas/EngineWorkerSchedule" }
        provider: { type: object, required: [model, available], properties: { model: { type: string }, available: { type: boolean } } }
    EngineRuntimeInput:
      type: object
      additionalProperties: false
      required: [revision, enabled, mode, aiEnabled, commentsEnabled, repliesEnabled, reactionsEnabled, followsEnabled, perAccountDailyLimit, hourlyPostLimit, dailyActionLimit, organicThreshold, maxConsecutiveFailures, retryBackoffMinutes, sourceFetchIntervalMinutes]
      properties:
        revision: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        mode: { type: string, enum: [review, automatic] }
        aiEnabled: { type: boolean }
        commentsEnabled: { type: boolean }
        repliesEnabled: { type: boolean }
        reactionsEnabled: { type: boolean }
        followsEnabled: { type: boolean }
        perAccountDailyLimit: { type: integer, minimum: 0, maximum: 2 }
        hourlyPostLimit: { type: integer, minimum: 0, maximum: 4 }
        dailyActionLimit: { type: integer, minimum: 0, maximum: 10 }
        organicThreshold: { type: integer, minimum: 5, maximum: 100 }
        maxConsecutiveFailures: { type: integer, minimum: 1, maximum: 5 }
        retryBackoffMinutes: { type: integer, minimum: 15, maximum: 1440 }
        sourceFetchIntervalMinutes: { type: integer, minimum: 15, maximum: 1440 }
    EngineRuntimeState:
      type: object
      required: [failures, aiFailures, lastError, lastRunAt, retryAfterAt]
      properties:
        failures: { type: integer, minimum: 0 }
        aiFailures: { type: integer, minimum: 0 }
        lastError: { type: [string, "null"] }
        lastRunAt: { type: [integer, "null"] }
        retryAfterAt: { type: [integer, "null"] }
    EngineAccountActivity:
      type: object
