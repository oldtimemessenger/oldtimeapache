openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and sessions
  - name: social
    description: Cloud-backed profiles, posts, and likes
paths:
  /account/library/saved:
    get:
      operationId: listLibrarySaved
      summary: List the signed-in user's privately saved non-Community posts
      tags: [Account]
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, reels, posts], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 18 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Private saved posts, subject to current visibility and blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySavedPage"
  /stories/archived:
    get:
      operationId: listArchivedStories
      summary: List only the signed-in author's expired, archived stories
      tags: [Stories]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 18 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Owner-only archived stories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivedStoryPage"
  /posts/{postId}/likes:
    get:
      operationId: getPostLikes
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        "200":
          description: Real recorded likes, human profiles first, bounded pagination, with virtual accounts counted separately.
          content:
            application/json:
              schema:
                type: object
                required: [likes, total, humanTotal, virtualTotal, hasMore, nextOffset]
                properties:
                  likes: { type: array, items: { $ref: "#/components/schemas/PublicProfile" } }
                  total: { type: integer, minimum: 0 }
                  humanTotal: { type: integer, minimum: 0 }
                  virtualTotal: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
                  nextOffset: { type: integer, minimum: 0 }
  /posts/{postId}/reposts:
    get:
      operationId: getPostReposts
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        "200":
          description: Visible non-virtual accounts that reposted the accessible post, with bounded pagination.
          content:
            application/json:
              schema:
                type: object
                required: [reposts, total, hasMore, nextOffset]
                properties:
                  reposts: { type: array, items: { $ref: "#/components/schemas/PublicProfile" } }
                  total: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
                  nextOffset: { type: integer, minimum: 0 }
  /engine/operations:
    get:
      operationId: getEngineOperations
      tags: [engine]
      responses:
        "200":
          description: Restricted runtime configuration, review queues and human-only activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineOperationsSnapshot" }
    put:
      operationId: updateEngineRuntime
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineRuntimeInput" }
      responses:
        "200":
          description: Saved runtime configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRuntimeInput" }
  /engine/operations/bootstrap:
    post:
      operationId: bootstrapEnginePersonas
      tags: [engine]
      responses:
        "200":
          description: Add personality configurations, without creating logins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/events:
    post:
      operationId: createEngineEvent
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineEventInput" }
      responses:
        "201":
          description: Shared deduplicated event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/events/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: reviewEngineEvent
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineEventInput" }
      responses:
        "200":
          description: Revision-checked verification and rights review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/ingest:
    post:
      operationId: ingestEngineSource
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineIngestInput" }
      responses:
        "200":
          description: Imported source items awaiting review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/generate:
    post:
      operationId: generateEngineDraft
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineGenerationInput" }
      responses:
        "200":
          description: Idempotent draft. AI text always requires review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/drafts/{draftId}/review:
    parameters:
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reviewEngineDraft
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineReviewInput" }
      responses:
        "200":
          description: Reviewed draft; publication still checks current authorization and quotas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/run:
    post:
      operationId: runEngineCycle
      tags: [engine]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineCycleInput" }
      responses:
        "200":
          description: Bounded leased processing cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/operations/actions/{actionId}/undo:
    parameters:
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: undoEngineAction
      tags: [engine]
      responses:
        "200":
          description: Reverse only the specified automated interaction and preserve its audit record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineRecord" }
  /engine/admin:
    get:
      operationId: getSocialEngineAdmin
      tags: [social]
      summary: Administrator-only paused social-engine foundation
      responses:
        "200":
          description: Bounded registry, budget, planning history and capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineDashboard" }
  /engine/admin/config:
    put:
      operationId: updateSocialEngineConfig
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEngineConfigInput" }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineConfigInput" }
  /engine/admin/accounts:
    post:
      operationId: createSocialEngineAccount
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEngineAccountInput" }
      responses:
        "201":
          description: Created virtual-account configuration, not a login or live profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineAccount" }
  /engine/admin/accounts/{accountId}:
    put:
      operationId: updateSocialEngineAccount
      tags: [social]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEngineAccountInput" }
      responses:
        "200":
          description: Updated configuration; retirement preserves historical records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineAccount" }
    delete:
      operationId: deleteSocialEngineAccount
      tags: [social]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Empty accounts are removed; accounts with content or activity are privately retired and their history is preserved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineAccountDeleteResult" }
  /engine/admin/sources:
    post:
      operationId: createSocialEngineSource
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEngineSourceInput" }
      responses:
        "201":
          description: Registered source metadata; no source fetch is performed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineSource" }
  /engine/admin/sources/{sourceId}:
    put:
      operationId: updateSocialEngineSource
      tags: [social]
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEngineSourceInput" }
      responses:
        "200":
          description: Updated source metadata and authorization record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineSource" }
  /engine/admin/simulate:
    post:
      operationId: simulateSocialEngine
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEngineSimulationInput" }
      responses:
        "200":
          description: Idempotent intent planning only; never calls AI or publishes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEngineSimulationResult" }
  /engine/preferences:
    get:
      operationId: getSocialEnginePreferences
      tags: [social]
      responses:
        "200":
          description: Current user's virtual-account preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEnginePreferences" }
    put:
      operationId: updateSocialEnginePreferences
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEnginePreferences" }
      responses:
        "200":
          description: Saved preferences; automated follows default to disallowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEnginePreferences" }
  /discovery/explore:
    get:
      operationId: getExploreDiscovery
      tags: [social]
      summary: Indexed public discovery with deterministic topic grouping
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: topic, in: query, schema: { type: string, maxLength: 64 } }
        - { name: sort, in: query, schema: { type: string, enum: [top, recent, engagement, shuffle], default: top } }
        - { name: shuffleSeed, in: query, description: Optional per-viewer seed that keeps a shuffled page order stable while paging, schema: { type: string, maxLength: 48, pattern: "^[a-z0-9-]+$" } }
        - name: type
          in: query
          schema:
            type: string
            enum: [all, videos, photos, posts, people, hashtags, community, places]
            default: all
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 24 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: recommendations, in: query, description: Return public posts matched to the viewer's explicitly selected interests, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Viewer-authorized results; counts describe the bounded result window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreDiscoveryResponse" }
        "400":
          description: Invalid filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /discovery/topics:
    get:
      operationId: listAutomaticTopics
      tags: [social]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 40, default: 20 } }
      responses:
        "200":
          description: Qualified topics ordered by query relevance, then permitted personalization
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics: { type: array, items: { $ref: "#/components/schemas/DiscoveryTopicCount" } }
  /discovery/topics/{topicId}:
    get:
      operationId: getAutomaticTopic
      tags: [social]
      parameters:
        - { name: topicId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Reusable topic metadata; content uses discovery/explore with the returned topic id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryTopicProfile" }
  /discovery/topics/{topicId}/follow:
    put:
      operationId: followAutomaticTopic
      tags: [social]
      parameters:
        - { name: topicId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryTopicFollowInput" }
      responses:
        "200":
          description: Private topic-follow preference saved
          content:
            application/json:
              schema:
                type: object
                required: [topicId, followed]
                properties:
                  topicId: { type: string }
                  followed: { type: boolean }
  /discovery/topics/{topicId}/merge:
    post:
      operationId: mergeAutomaticTopic
      tags: [social]
      parameters:
        - { name: topicId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryTopicMergeInput" }
      responses:
        "200":
          description: Moderator-only alias merge; original content and associations retained
          content:
            application/json:
              schema:
                type: object
                required: [topicId, targetTopicId]
                properties:
                  topicId: { type: string }
                  targetTopicId: { type: string }
  /discovery/topic-events:
    post:
      operationId: recordAutomaticTopicEvent
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryTopicEvent" }
      responses:
        "200":
          description: Bounded daily signal; no raw search query is retained
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
  /discovery/preferences:
    put:
      operationId: updateDiscoveryPreferences
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryPreferences" }
      responses:
        "200":
          description: Saved for the authenticated account only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPreferencesResponse" }
  /discovery/posts/{postId}/topics:
    put:
      operationId: correctDiscoveryPostTopics
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryTopicCorrection" }
      responses:
        "200":
          description: Owner-only suppression of incorrect topics; no arbitrary topic assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPostTopics" }
        "403":
          description: The authenticated account does not own this post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      parameters:
        - name: before
          in: query
          schema: { type: number, minimum: 1 }
      responses:
        "200":
          description: Authenticated account activity, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationFeed"
  /notifications/read:
    post:
      operationId: readNotifications
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Read cursor saved to the account
          content:
            application/json:
              schema:
                type: object
                required: [readAt]
                properties:
                  readAt: { type: number }
  /places/search:
    get:
      operationId: searchPlaces
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Explicit place search using OpenStreetMap data, never automatic device tagging
          content:
            application/json:
              schema:
                type: object
                required: [places, attribution]
                properties:
                  places: { type: array, items: { $ref: "#/components/schemas/PlaceTag" } }
                  attribution:
                    type: object
                    required: [text, url]
                    properties:
                      text: { type: string }
                      url: { type: string }
        "503":
          description: Search unavailable; manual place tagging remains available
  /places/discovery:
    get:
      operationId: getPlacesDiscovery
      security: [{ BearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Match labels of places already tagged on public Oldtime posts
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: Public places tagged on Oldtime posts, filtered for block safety
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacesDiscoveryResponse" }
  /places/profile:
    get:
      operationId: getPlaceProfile
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: placeId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: label, in: query, schema: { type: string, maxLength: 140 } }
        - { name: peopleOffset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: reviewsOffset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: Place profile with public posts, people, ratings and tips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceProfile" }
  /places/saved:
    get:
      operationId: getSavedPlaces
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Private saved places
          content:
            application/json:
              schema:
                type: object
                properties:
                  places: { type: array, items: { $ref: "#/components/schemas/PlaceTag" } }
    put:
      operationId: savePlace
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedPlaceInput" }
      responses:
        "200": { description: Place saved }
    delete:
      operationId: unsavePlace
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedPlaceInput" }
      responses:
        "200": { description: Place removed from saved places }
  /places/reviews:
    put:
      operationId: putPlaceReview
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceReviewInput" }
      responses:
        "200":
          description: Saved or edited the signed-in person's review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceReview" }
  /places/reviews/{id}/report:
    post:
      operationId: reportPlaceReview
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Report recorded for review
          content:
            application/json:
              schema:
                type: object
                required: [reported]
                properties:
                  reported: { type: boolean }
  /places/feed:
    get:
      operationId: listPlaceFeed
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [top, recent], default: recent } }
        - { name: placeId, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: label, in: query, schema: { type: string, minLength: 1, maxLength: 140 } }
        - { name: q, in: query, description: Filter place-tagged posts by location name or caption hashtag, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 18 } }
      responses:
        "200":
          description: Public place-tagged posts, optionally filtered by a selected place or search text, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceFeedResponse" }
        "400": { description: Invalid place query }
  /sports/workouts:
    get:
      operationId: listSportsWorkouts
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Owner-only private workout history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [workouts]
                properties:
                  workouts: { type: array, items: { $ref: "#/components/schemas/SportsWorkout" } }
                  nextOffset: { type: [integer, "null"] }
  /sports/workouts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveSportsWorkout
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SportsRecording" }
      responses:
        "200":
          description: Idempotently saved; statistics computed on server, not supplied by client
          content:
            application/json:
              schema:
                type: object
                required: [workout]
                properties:
                  workout: { $ref: "#/components/schemas/SportsWorkout" }
        "409": { description: ID already belongs to a different recording }
    get:
      operationId: getSportsWorkout
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner-only route and summary
          content:
            application/json:
              schema:
                type: object
                required: [workout]
                properties:
                  workout: { $ref: "#/components/schemas/SportsWorkout" }
        "404": { description: Workout absent or not owned by viewer }
    delete:
      operationId: deleteSportsWorkout
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: "Private recording, exported cards and associated public sports post removed" }
  /sports/workouts/{id}/card:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadSportsCard
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201":
